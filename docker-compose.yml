      PORT: 3002
      DATABASE_URL: postgresql://postgres:root@postgres:5432/mypet_users
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://mypet:mypet123@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  establishment:
