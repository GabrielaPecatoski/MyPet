services:

  postgres:
    image: postgres:16
    container_name: mypet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mypet_auth
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mypet-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: mypet
      RABBITMQ_DEFAULT_PASS: mypet123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    container_name: mypet-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
        SERVICE_PORT: 3000
    container_name: mypet-gateway
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://user-auth:3001
      USER_PET_SERVICE_URL: http://user-pet:3002
      ESTABLISHMENT_SERVICE_URL: http://establishment:3003
      MARKETPLACE_SERVICE_URL: http://marketplace:3004
      BOOKING_SERVICE_URL: http://booking:3005
      NOTIFICATION_SERVICE_URL: http://notification:3006
      REVIEW_SERVICE_URL: http://review:3007
      FAQ_SERVICE_URL: http://faq:3008
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  user-auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-auth
        SERVICE_PORT: 3001
    container_name: mypet-auth
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:root@postgres:5432/mypet_auth
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://mypet:mypet123@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  user-pet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-pet
        SERVICE_PORT: 3002
    container_name: mypet-user-pet
