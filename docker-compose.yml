x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    consul:
      condition: service_healthy
  networks:
    - mypet-network

services:

  postgres:
    image: postgres:16-alpine
    container_name: mypet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mypet-network

  consul:
    image: consul:1.15
    container_name: mypet-consul
    restart: unless-stopped
    ports:
      - '8500:8500'
    command: agent -dev -ui -client=0.0.0.0
    healthcheck:
      test: ['CMD', 'consul', 'members']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mypet-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mypet-rabbitmq
    hostname: mypet-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: mypet
      RABBITMQ_DEFAULT_PASS: mypet123
      RABBITMQ_ERLANG_COOKIE: mypet_erlang_cookie
      HOME: /tmp
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      start_period: 30s
      timeout: 20s
      retries: 12
    networks:
      - mypet-network

  adminer:
    image: adminer:4.8.1-standalone
    container_name: mypet-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '8080:8080'
    networks:
      - mypet-network

  api-gateway:
    <<: *service-defaults
    build: ./api-gateway
    container_name: mypet-gateway
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      JWT_SECRET: mypet_super_secret_change_in_production
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_PET_SERVICE_URL: http://user-pet-service:3002
      ESTABLISHMENT_SERVICE_URL: http://establishment-service:3003
      MARKETPLACE_SERVICE_URL: http://marketplace-service:3004
      BOOKING_SERVICE_URL: http://booking-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      REVIEW_SERVICE_URL: http://review-service:3007
      FAQ_SERVICE_URL: http://faq-service:3008
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
    depends_on:
      consul:
        condition: service_healthy

  auth-service:
    <<: *service-defaults
    build: ./auth-service
    container_name: mypet-auth
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:root@postgres:5432/mypet_auth
      JWT_SECRET: mypet_super_secret_change_in_production
      CONSUL_HOST: consul
      CONSUL_PORT: 8500

  user-pet-service:
    <<: *service-defaults
    build: ./user-pet-service
    container_name: mypet-user-pet
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://postgres:root@postgres:5432/mypet_users
      JWT_SECRET: mypet_super_secret_change_in_production
      CONSUL_HOST: consul
      CONSUL_PORT: 8500

  establishment-service:
    <<: *service-defaults
    build: ./establishment-service
    container_name: mypet-establishment
    ports:
      - '3003:3003'
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://postgres:root@postgres:5432/mypet_estab
      JWT_SECRET: mypet_super_secret_change_in_production
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      BOOKING_SERVICE_URL: http://booking-service:3005
      REVIEW_SERVICE_URL: http://review-service:3007

  marketplace-service:
    <<: *service-defaults
    build: ./marketplace-service
    container_name: mypet-marketplace
    ports:
      - '3004:3004'
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://postgres:root@postgres:5432/mypet_market
      CONSUL_HOST: consul
      CONSUL_PORT: 8500

  booking-service:
    <<: *service-defaults
    build: ./booking-service
    container_name: mypet-booking
    ports:
      - '3005:3005'
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://postgres:root@postgres:5432/mypet_booking
      RABBITMQ_URL: amqp://mypet:mypet123@rabbitmq:5672
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy

  notification-service:
    <<: *service-defaults
    build: ./notification-service
    container_name: mypet-notification
    ports:
      - '3006:3006'
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://postgres:root@postgres:5432/mypet_notif
      RABBITMQ_URL: amqp://mypet:mypet123@rabbitmq:5672
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy

  review-service:
    <<: *service-defaults
    build: ./review-service
    container_name: mypet-review
    ports:
      - '3007:3007'
    environment:
      PORT: 3007
      DATABASE_URL: postgresql://postgres:root@postgres:5432/mypet_review
      RABBITMQ_URL: amqp://mypet:mypet123@rabbitmq:5672
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy

  faq-service:
    <<: *service-defaults
    build: ./faq-service
    container_name: mypet-faq
    ports:
      - '3008:3008'
    environment:
      PORT: 3008
      DATABASE_URL: postgresql://postgres:root@postgres:5432/mypet_faq
      ADMIN_SECRET: mypet_admin_secret
      CONSUL_HOST: consul
      CONSUL_PORT: 8500

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  mypet-network:
