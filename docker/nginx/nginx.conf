resolver 127.0.0.11 valid=10s ipv6=off;

# Necessário para o proxy de WebSocket (Socket.IO do chat): mapeia o header
# Upgrade para o valor correto de Connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    # Dev local: serve a API direto por HTTP (app Flutter web e testes usam http://localhost).
    # SSE (notificações em tempo real): desativa o buffering para o stream fluir
    # evento a evento em vez de ficar preso no buffer do nginx.
    location /notifications/stream {
        set $upstream http://api-gateway:3000;
        proxy_pass            $upstream;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Connection        "";
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # WebSocket do chat (Socket.IO): repassa o upgrade da conexão.
    location /socket.io {
        set $upstream http://api-gateway:3000;
        proxy_pass            $upstream;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $connection_upgrade;
        proxy_read_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    location / {
        set $upstream http://api-gateway:3000;
        proxy_pass            $upstream;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options           DENY                                   always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header X-XSS-Protection          "1; mode=block"                        always;
    add_header Referrer-Policy           "no-referrer"                          always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"  always;

    server_tokens off;
    client_max_body_size 10m;

    # SSE (notificações em tempo real): desativa o buffering para o stream fluir
    # evento a evento em vez de ficar preso no buffer do nginx.
    location /notifications/stream {
        set $upstream http://api-gateway:3000;
        proxy_pass            $upstream;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Connection        "";
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # WebSocket do chat (Socket.IO): repassa o upgrade da conexão.
    location /socket.io {
        set $upstream http://api-gateway:3000;
        proxy_pass            $upstream;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $connection_upgrade;
        proxy_read_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    location / {
        set $upstream http://api-gateway:3000;
        proxy_pass            $upstream;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }
}
