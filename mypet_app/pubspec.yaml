name: mypet_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.0.5

  http: ^1.2.1

  image_picker: ^1.0.7

  shared_preferences: ^2.2.2

  # WEBSOCKET / SOCKET.IO
  socket_io_client: ^2.0.3

  # PUSH NOTIFICATIONS (requer: flutterfire configure + google-services.json + GoogleService-Info.plist)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
  - assets/images/
  - assets/sounds/